# Site settings
title: Brandon Ho
author: Brandon Ho
email: ho.brandon.g@gmail.com
copyright: © 2026 Brandon Ho
lang: en

# Short tagline used in the <title> tag. Keep this under ~60 characters.
tagline: Robotics Ph.D. Student at Georgia Tech

# Longer blurb shown beside the avatar on the homepage, and used as the
# meta description for search results and link previews.
description: >-
  Robotics Ph.D. student at the Georgia Institute of Technology in Atlanta,
  Georgia. I develop high-level control and planning algorithms, using deep
  learning, for motion planning and navigation.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://brandongel.github.io" # no trailing slash

twitter_username: BrandongelHo
github_username: BrandonGel

show_excerpts: false # set to true to show post excerpts on the homepage

lin:
  date_format: "%b %-d, %Y"
  avatar_path: /assets/images/avatar.png
  social_links:
    twitter: BrandongelHo
    github: BrandonGel
    linkedin: BrandonHo2000

# The theme's home and post layouts read the date format from `minima`,
# not from `lin`. Keep both in sync.
minima:
  date_format: "%b %-d, %Y"

# Build settings
remote_theme: "ssokurenko/jekyll-lin-theme"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
