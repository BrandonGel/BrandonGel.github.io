{%- for post in include.posts -%}
<article class="entry">
  <div class="entry-year">{{ post.date | date: "%Y" }}</div>
  <div class="entry-body">
    <h3 class="entry-title"><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>
    {%- if post.venue %}<p class="entry-venue">{{ post.venue }}</p>{%- endif -%}
  </div>
</article>
{%- endfor -%}
