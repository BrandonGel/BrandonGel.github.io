---
layout: default
---
<section class="hero">
  <div class="wrap">
    <div class="hero-grid">
      <img class="hero-portrait" src="{{ site.lin.avatar_path | relative_url }}" alt="{{ site.author }}" width="120" height="120">
      <div>
        <h1>{{ site.author }}</h1>
        <p class="hero-role">{{ site.tagline }}</p>
        <p class="hero-bio">{{ site.description }}</p>
      </div>
    </div>

    <svg class="trajectory" viewBox="0 0 640 120" role="img" aria-label="A planned trajectory routing around obstacles">
      <circle class="obstacle" cx="190" cy="44" r="26"/>
      <circle class="obstacle" cx="330" cy="86" r="20"/>
      <circle class="obstacle" cx="470" cy="38" r="30"/>
      <path class="path" d="M14 78 C 90 78, 120 20, 190 12 S 268 74, 318 44 S 392 96, 452 82 S 540 30, 624 46"/>
      <circle class="waypoint" cx="14" cy="78" r="4"/>
      <circle class="waypoint" cx="190" cy="12" r="3"/>
      <circle class="waypoint" cx="318" cy="44" r="3"/>
      <circle class="waypoint" cx="452" cy="82" r="3"/>
      <circle class="goal" cx="624" cy="46" r="6"/>
    </svg>
  </div>
</section>

{%- assign research = site.categories.research -%}
{%- if research.size > 0 -%}
<section class="section">
  <div class="wrap">
    <h2 class="section-title">Publications</h2>
    {%- include entry-list.html posts=research -%}
  </div>
</section>
{%- endif -%}
